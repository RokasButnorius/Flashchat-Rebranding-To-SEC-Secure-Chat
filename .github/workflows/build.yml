name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r client-desktop/requirements.txt
          pip install sounddevice opencv-python numpy pillow

      - name: Build Executable with PyInstaller
        working-directory: client-desktop
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name="SEC" `
            --icon="logo.ico" `
            --collect-all "qasync" `
            --collect-all "PySide6" `
            --collect-all "sounddevice" `
            --collect-all "cv2" `
            --collect-all "numpy" `
            --collect-all "PIL" `
            --collect-all "certifi" `
            --hidden-import "sounddevice" `
            --hidden-import "cv2" `
            --hidden-import "numpy" `
            --add-data "source;source" `
            --add-data "theme.py;." `
            main.py

      - name: Compress Build Artifact
        run: |
          powershell Compress-Archive -Path dist/SEC/* -DestinationPath dist/SEC-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SEC-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
